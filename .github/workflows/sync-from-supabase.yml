name: Actualizar Quiniela automáticamente

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Obtener última versión desde Supabase
        env:
          SUPABASE_URL: https://jmgzozwtoqrchldwqkhd.supabase.co
          SUPABASE_KEY: sb_publishable_AYrVkrHQM4eE5Hhs7DhUlQ_rlC-L4-1
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/repo_files?select=path,content&order=path" \
            -o /tmp/repo_files.json

          python3 - <<'PY'
          import json
          from pathlib import Path, PurePosixPath

          rows = json.load(open("/tmp/repo_files.json", encoding="utf-8"))
          root = Path(".").resolve()

          for row in rows:
              rel = PurePosixPath(row["path"])

              if rel.is_absolute() or ".." in rel.parts:
                  raise SystemExit(f"Ruta no válida: {rel}")

              dest = root.joinpath(*rel.parts)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(row["content"], encoding="utf-8")
          PY

      - name: Publicar cambios en GitHub
        run: |
          if git diff --quiet; then
            echo "No hay cambios nuevos"
            exit 0
          fi

          git config user.name "Quiniela Auto Sync"
          git config user.email "actions@github.com"

          git add index.html app.js styles.css config.js manifest.webmanifest sw.js icon-192.svg icon-512.svg
          git commit -m "Actualización automática de la Quiniela"
          git push origin HEAD:main
